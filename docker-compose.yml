services:
  postgres:
    image: postgres:18
    container_name: hh-job-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hh_job_bot
      POSTGRES_USER: hh_job_bot
      POSTGRES_PASSWORD: hh_job_bot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
